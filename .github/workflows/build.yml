name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # NOTE: the runner image already ships the Android SDK at
      # /usr/local/lib/android/sdk. We use it directly instead of
      # android-actions/setup-android, which tries to install the
      # long-removed "tools" package and fails.
      - name: Install Android SDK packages
        run: |
          if [ -z "$ANDROID_SDK_ROOT" ]; then
            export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          CT=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/ | sort -V | tail -1)
          SDM="${CT}bin/sdkmanager"
          echo "Using $SDM"
          yes | "$SDM" --licenses > /dev/null
          "$SDM" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode keystore (tag builds only)
        # The KEYSTORE_BASE64 secret is decoded to app/publish.keystore.
        # Only needed for signed release builds on tags.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/publish.keystore
          ls -la app/publish.keystore

      - name: Build debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: gradle assembleDebug --stacktrace

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: gradle assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/publish.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Publish release APK to Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
